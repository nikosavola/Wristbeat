name: Release

# A tag is the one thing that publishes, and the tag name is what the three stores are keyed to.
# `v0.1.0` is the name F-Droid's UpdateCheckMode: Tags reads, the AAB is what Play takes, and the APK
# is what Galaxy Store and a manual install take. A manual run builds and stops, which is how a
# release is rehearsed without spending a version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only, and then the one job that writes to the repository asks for the permission itself.
permissions:
  contents: read

# Not cancelling: a second tag is not a newer version of the first one, and a release stopped between
# the upload and the notes is the one state that leaves the two disagreeing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package
    # Pinned rather than ubuntu-latest, which migrates to Ubuntu 26 from 19 October 2026 and would
    # change the toolchain under a workflow nobody edited.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      versionCode: ${{ steps.version.outputs.versionCode }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The version-code check compares this tag against the older tags, which a shallow
          # checkout does not have.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      # No dependency cache, deliberately: a cache a pull request could have written is a way into an
      # artifact published to a store. Tags are rare, so the cold build is cheap.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true

      # A tag is a store's idea of a version, so the tag, the versionName and the changelog named
      # after the versionCode all have to agree before anything is published from it.
      - name: Check the tag against the build
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: .github/scripts/check-release.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

      # Every store reads the same listing, and a title one character long or a screenshot at the
      # wrong size is refused at upload rather than here. A manual run checks it too.
      - name: Check what the stores will read
        run: python3 .github/scripts/check-stores.py

      # A release without the four secrets is still a release: F-Droid signs the APK it builds itself,
      # so a missing key costs only the Play upload.
      - name: Write the upload key, if there is one
        env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning title=No upload key::No UPLOAD_KEYSTORE_BASE64 secret, so this release is unsigned and only F-Droid can take the APK as it is. Add the four UPLOAD_* secrets to sign it."
            exit 0
          fi
          # Outside the checkout, so it cannot end up in an artifact by accident.
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/wristbeat-upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/wristbeat-upload.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties

      - name: Test and package
        run: ./gradlew :wear:testDebugUnitTest :wear:bundleRelease :wear:assembleRelease

      - name: Check what the build produced
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          aab=wear/build/outputs/bundle/release/wear-release.aab
          apk=$(ls wear/build/outputs/apk/release/wear-release*.apk)
          # Not jarsigner's exit code, which is 0 whether or not a bundle is signed: what a signature
          # leaves behind is its files, and an unsigned bundle has none of them at its root.
          if unzip -Z1 "$aab" | grep -qE '^META-INF/[^/]+\.(RSA|DSA|EC)$'; then bundle=yes; else bundle=no; fi
          # An APK does not have to be signed, which is why Gradle names the unsigned one that way.
          apk_signed=yes
          case $apk in *-unsigned.apk) apk_signed=no ;; esac
          {
            echo "### $TAG"
            echo
            echo "| artifact | size | signature |"
            echo "| --- | --- | --- |"
            echo "| $(basename "$aab") | $(du -h "$aab" | cut -f1) | $bundle |"
            echo "| $(basename "$apk") | $(du -h "$apk" | cut -f1) | $apk_signed |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$bundle" = no ]; then
            echo "::warning title=Unsigned bundle::Play refuses an unsigned bundle. Add the four UPLOAD_* secrets to sign it."
          fi

      # upload-artifact keeps the common parent of its paths, so the three files would come back in
      # bundle/, apk/ and mapping/ subfolders and the jobs below would not find them.
      - name: Gather what the build produced
        run: |
          set -eu
          mkdir dist
          cp wear/build/outputs/bundle/release/wear-release.aab dist/
          cp wear/build/outputs/apk/release/wear-release*.apk dist/
          cp wear/build/outputs/mapping/release/mapping.txt dist/

      - name: Keep what the build produced
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          # The mapping is Play's, for reading a stack trace, and far too big to be a download anyone
          # wants, which is why it is in the artifact and not on the release.
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only write in the workflow, so the only job given a write permission.
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Take the artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: artifacts

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION_CODE: ${{ needs.build.outputs.versionCode }}
        run: |
          set -eu
          # The same file Play shows as "what's new", so the release notes and the store listing
          # cannot drift apart.
          notes="$RUNNER_TEMP/notes.md"
          cat "fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt" > "$notes"
          {
            echo
            echo "The AAB is what Play takes, the APK is what Galaxy Store takes and what anyone can sideload."
            echo
            echo '```'
            # The mapping file is deliberately not here: it is 23 MB of Play's business, not a download.
            (cd artifacts && sha256sum wear-release.aab wear-release*.apk)
            echo '```'
          } >> "$notes"
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$notes" \
            artifacts/wear-release.aab artifacts/wear-release*.apk

  play:
    name: Upload the bundle to Play
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # A job cannot be conditional on a secret, so the first step asks and the rest read the answer,
      # which keeps a release green while the Play account is still being set up.
      - name: Is there a service account for Play?
        id: account
        env:
          ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Without one, say what is missing
        if: steps.account.outputs.configured == 'false'
        run: |
          {
            echo "### Play upload skipped"
            echo
            echo "No \`PLAY_SERVICE_ACCOUNT_JSON\` secret, so the bundle was released and not uploaded."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Play upload skipped::Add PLAY_SERVICE_ACCOUNT_JSON and a tag uploads itself to the internal track."

      - name: Take the artifacts
        if: steps.account.outputs.configured == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: artifacts

      - name: Check out
        if: steps.account.outputs.configured == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The action wants release notes in files named `whatsnew-<locale>`, so the changelog, which is
      # already the store's "what's new" and the release notes, is copied into that shape rather than
      # written a second time.
      - name: Put what's new where the action looks for it
        if: steps.account.outputs.configured == 'true'
        env:
          VERSION_CODE: ${{ needs.build.outputs.versionCode }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/whatsnew"
          cp "fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt" "$RUNNER_TEMP/whatsnew/whatsnew-en-US"

      - name: A signed bundle or nothing
        if: steps.account.outputs.configured == 'true'
        run: |
          set -eu
          # Play refuses an unsigned bundle and reports it in a way that is hard to trace back to a
          # missing secret, so this says it first. The signature's own files are the test.
          unzip -Z1 artifacts/wear-release.aab | grep -qE '^META-INF/[^/]+\.(RSA|DSA|EC)$' ||
            { echo "::error title=Unsigned bundle::This release was built without an upload key, so Play would refuse it. Add the UPLOAD_* secrets and tag again."; exit 1; }

      - name: Upload to Play
        if: steps.account.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fi.nikosavola.wristbeat
          releaseFiles: artifacts/wear-release.aab
          mappingFile: artifacts/mapping.txt
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
          # A tag lands on the internal track rather than in front of everyone, and a human promotes
          # it from the console. Play wants that order anyway, since the first release has to go
          # through an earlier track.
          tracks: internal
          status: completed

  galaxystore:
    name: Upload the APK to Galaxy Store
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The same shape as the Play job: a job cannot test a secret, so a step asks and the rest read
      # the answer, which keeps a release green while Seller Portal is still being set up.
      - name: Is there a Galaxy Store service account?
        id: account
        env:
          TOKEN: ${{ secrets.SAMSUNG_ACCESS_TOKEN }}
          SERVICE_ACCOUNT_ID: ${{ secrets.SAMSUNG_SERVICE_ACCOUNT_ID }}
          CONTENT_ID: ${{ secrets.SAMSUNG_CONTENT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$SERVICE_ACCOUNT_ID" ] && [ -n "$CONTENT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Without one, say what is missing
        if: steps.account.outputs.configured == 'false'
        run: |
          {
            echo "### Galaxy Store upload skipped"
            echo
            echo "No \`SAMSUNG_ACCESS_TOKEN\`, \`SAMSUNG_SERVICE_ACCOUNT_ID\` and \`SAMSUNG_CONTENT_ID\` secret, so the APK was released and not uploaded."
            echo
            echo "The content ID only exists once the app is registered in Seller Portal, which is why the first upload is by hand."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Galaxy Store upload skipped::Add the three SAMSUNG_* secrets and a tag uploads the APK for review."

      - name: Check out
        if: steps.account.outputs.configured == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Ruby
        if: steps.account.outputs.configured == 'true'
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Take the artifacts
        if: steps.account.outputs.configured == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: artifacts

      - name: A signed APK or nothing
        if: steps.account.outputs.configured == 'true'
        run: |
          set -eu
          # Galaxy Store refuses an unsigned APK, and the build names it that way, so the filename is
          # the test. The same upload key signs this and the bundle.
          apk=$(ls artifacts/wear-release*.apk)
          case $apk in
            *-unsigned.apk)
              echo "::error title=Unsigned APK::This release was built without an upload key, so Galaxy Store would refuse it. Add the UPLOAD_* secrets and tag again."
              exit 1
              ;;
          esac
          echo "SAMSUNG_APK_PATH=$apk" >> "$GITHUB_ENV"

      - name: Upload and submit for review
        if: steps.account.outputs.configured == 'true'
        env:
          SAMSUNG_ACCESS_TOKEN: ${{ secrets.SAMSUNG_ACCESS_TOKEN }}
          SAMSUNG_SERVICE_ACCOUNT_ID: ${{ secrets.SAMSUNG_SERVICE_ACCOUNT_ID }}
          SAMSUNG_CONTENT_ID: ${{ secrets.SAMSUNG_CONTENT_ID }}
        run: bundle exec fastlane android galaxystore
