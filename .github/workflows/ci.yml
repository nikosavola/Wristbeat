name: CI

# The gate that is run locally and nothing more: the JVM test suite, lint, and the two artifacts the
# stores take (the unsigned APK F-Droid builds from, and the bundle Play takes). No device, because
# the suite is written to need none.
#
# A private repository's minutes are metered, so it is one job on the cheapest runner, a
# documentation-only change is excluded, a superseded run is cancelled, and the Gradle tasks are
# one invocation so the daemon and the configuration cache are paid for once.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "fastlane/**"
      - ".github/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "fastlane/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Test, lint and build
    # Pinned rather than ubuntu-latest, which starts migrating to Ubuntu 26 on 19 October 2026 and
    # would change the toolchain under a workflow nobody edited.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing here writes to the repository, so no later step needs the token left behind.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # compileSdk is 37, which a runner image may not have installed yet. AGP fetches a missing
      # platform itself and the images pre-accept the licences for it, so a bump costs a slow run
      # rather than a broken one. koverXmlReportDebug depends on the tests, so keeping it in this
      # one invocation is what keeps the suite to a single run.
      #
      # The listing check runs before the long step: a manifest or version change can break what
      # the stores read without touching anything under fastlane, which has its own workflow.
      - name: Check what the stores will read
        run: python3 .github/scripts/check-stores.py

      - name: Test, lint and build
        run: ./gradlew :wear:testDebugUnitTest :wear:koverXmlReportDebug :wear:lintDebug :wear:assembleRelease :wear:bundleRelease

      # A job cannot be conditional on a secret, so the first step asks about the token and the rest
      # read the answer. There is no token until the repository is public and coverage is enabled on
      # Codecov, so the job is green while it is not configured.
      - name: Is there a Codecov token?
        id: codecov
        env:
          TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Without one, say what is missing
        if: steps.codecov.outputs.configured == 'false'
        run: |
          echo "::notice title=Coverage not uploaded::No CODECOV_TOKEN secret, so the coverage report stayed on the runner. Enabled by adding the token when the repository goes public."

      # A reporting side channel rather than a gate: codecov.io has full outages, which must not
      # block an otherwise-green push. The tests themselves already failed the job above.
      - name: Upload coverage to Codecov
        if: steps.codecov.outputs.configured == 'true'
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: wear/build/reports/kover/reportDebug.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: steps.codecov.outputs.configured == 'true' && !cancelled()
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: wear/build/test-results/testDebugUnitTest/*.xml
