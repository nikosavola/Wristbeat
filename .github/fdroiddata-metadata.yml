# Draft for metadata/fi.nikosavola.wristbeat.yml in a merge request against fdroiddata.
#
# The file name has to be the application id the APK is built with, and the commit has to be the full
# hash of a release tag whose name matches versionName (v0.1.0 for 0.1.0), because that is what
# UpdateCheckMode: Tags reads. The tag is the one thing still missing, and
# .github/scripts/check-release.sh checks that the tag, the versionName and the changelog named after
# the versionCode agree before it is pushed.
#
# Submission waits for android-37 to be a released platform. The app compiles against it because
# androidx.appfunctions refuses anything older (see the note in wear/build.gradle.kts), and a build
# server installs only platforms that have shipped. If the build server is still without 37 well
# after it ships, the thing to drop is the agent functions: they are alpha, no shipping assistant can
# call them, and they are one source file plus a dependency, so the build would compile against
# android-36 without them.

Categories:
  - Sports & Health
License: Apache-2.0
AuthorName: Niko Savola
SourceCode: https://github.com/nikosavola/Wristbeat
IssueTracker: https://github.com/nikosavola/Wristbeat/issues
Changelog: https://github.com/nikosavola/Wristbeat/releases
Liberapay: nikosavola

AutoName: Wristbeat

RepoType: git
Repo: https://github.com/nikosavola/Wristbeat

Builds:
  - versionName: 0.1.0
    versionCode: 360000100
    commit: <the full hash of the v0.1.0 commit>
    gradle: yes
    output: wear/build/outputs/apk/release/wear-release-unsigned.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.1.0
CurrentVersionCode: 360000100
